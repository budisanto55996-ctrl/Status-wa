untuk menjadi pribadi yang bermanfaat.","category":"islami"},{"text":"Semoga Allah membantu kita untuk menjaga hati ketika mendapat pujian.","category":"islami"},{"text":"Semoga Allah membantu kita untuk tetap rendah hati ketika berhasil.","category":"islami"},{"text":"Tenang, semua akan menemukan jalannya.","category":"singkat"},{"text":"Tidak harus ramai untuk menjadi berarti.","category":"singkat"},{"text":"Hari ini cukup dijalani dengan jujur.","category":"singkat"},{"text":"Pilih damai daripada menang sendiri.","category":"singkat"},{"text":"Sedikit demi sedikit tetap bergerak.","category":"singkat"},{"text":"Jangan lupa menikmati proses.","category":"singkat"},{"text":"Senyum dulu, sisanya menyusul.","category":"singkat"},{"text":"Yang sederhana sering paling berkesan.","category":"singkat"},{"text":"Tidak semua hal perlu dijelaskan.","category":"singkat"},{"text":"Waktu akan menjawab dengan caranya.","category":"singkat"},{"text":"Tetap baik tanpa menunggu balasan.","category":"singkat"},{"text":"Jaga hati, jaga ucapan.","category":"singkat"},{"text":"Lakukan yang benar meski sepi.","category":"singkat"},{"text":"Kamu berhak beristirahat.","category":"singkat"},{"text":"Jangan menyerah pada hari buruk.","category":"singkat"},{"text":"Ada harapan setelah lelah.","category":"singkat"},{"text":"Pilih orang yang memilihmu.","category":"singkat"},{"text":"Jangan kehilangan diri demi diterima.","category":"singkat"},{"text":"Nikmati kopi, lanjutkan hidup.","category":"singkat"},{"text":"Rezeki punya jalan masing-masing.","category":"singkat"},{"text":"Hari baru, pilihan baru.","category":"singkat"},{"text":"Berani mulai, berani belajar.","category":"singkat"},{"text":"Diam bukan berarti kalah.","category":"singkat"},{"text":"Sabar bukan berarti pasrah.","category":"singkat"},{"text":"Cukupkan yang bisa dicukupkan.","category":"singkat"},{"text":"Tidak perlu terburu-buru.","category":"singkat"},{"text":"Hargai waktu yang masih ada.","category":"singkat"},{"text":"Jangan jadikan iri sebagai arah.","category":"singkat"},{"text":"Kerja baik, hati baik.","category":"singkat"},{"text":"Jangan takut berubah.","category":"singkat"},{"text":"Memaafkan membuat langkah ringan.","category":"singkat"},{"text":"Pulanglah dengan hati tenang.","category":"singkat"},{"text":"Jaga orang yang selalu hadir.","category":"singkat"},{"text":"Kebaikan tidak pernah sia-sia.","category":"singkat"},{"text":"Bersyukur sebelum meminta.","category":"singkat"},{"text":"Satu langkah hari ini berarti.","category":"singkat"},{"text":"Kamu tidak sendirian.","category":"singkat"},{"text":"Percaya pada prosesmu sendiri.","category":"singkat"},{"text":"Tidak perlu membuktikan semuanya.","category":"singkat"},{"text":"Hidup bukan perlombaan.","category":"singkat"},{"text":"Tetap rendah hati saat berhasil.","category":"singkat"},{"text":"Belajar dari yang kemarin.","category":"singkat"},{"text":"Jangan ulangi luka yang sama.","category":"singkat"},{"text":"Pilih sehat, pilih tenang.","category":"singkat"},{"text":"Jangan abaikan orang rumah.","category":"singkat"},{"text":"Waktu bersama keluarga itu mahal.","category":"singkat"},{"text":"Kabar baik sedang menuju arahmu.","category":"singkat"},{"text":"Semoga urusanmu dimudahkan.","category":"singkat"},{"text":"Jangan simpan dendam terlalu lama.","category":"singkat"},{"text":"Hati yang lega lebih berharga.","category":"singkat"},{"text":"Berhenti sejenak bukan gagal.","category":"singkat"},{"text":"Tumbuh tanpa harus menjelaskan.","category":"singkat"},{"text":"Jangan takut menjadi berbeda.","category":"singkat"},{"text":"Ketenangan juga sebuah pencapaian.","category":"singkat"},{"text":"Bahagia tidak harus mahal.","category":"singkat"},{"text":"Syukuri hal kecil hari ini.","category":"singkat"},{"text":"Jaga mimpi tetap hidup.","category":"singkat"},{"text":"Kerjakan, bukan hanya rencanakan.","category":"singkat"},{"text":"Buktikan dengan tindakan.","category":"singkat"},{"text":"Jangan biarkan malas memimpin.","category":"singkat"},{"text":"Waktu terbaik adalah sekarang.","category":"singkat"},{"text":"Mulai dari yang paling mudah.","category":"singkat"},{"text":"Selesaikan satu hal dahulu.","category":"singkat"},{"text":"Kamu boleh belajar ulang.","category":"singkat"},{"text":"Kegagalan bukan akhir cerita.","category":"singkat"},{"text":"Jangan takut meminta bantuan.","category":"singkat"},{"text":"Kesehatan tetap nomor satu.","category":"singkat"},{"text":"Tidur cukup, berpikir jernih.","category":"singkat"},{"text":"Jaga tubuh selama mengejar tujuan.","category":"singkat"},{"text":"Tidak semua peluang harus diambil.","category":"singkat"},{"text":"Pilih yang benar-benar penting.","category":"singkat"},{"text":"Kurangi drama, tambah syukur.","category":"singkat"},{"text":"Jangan hidup dari penilaian orang.","category":"singkat"},{"text":"Tetap lembut, tetap punya batas.","category":"singkat"},{"text":"Jujur memang tidak selalu mudah.","category":"singkat"},{"text":"Kepercayaan harus dijaga.","category":"singkat"},{"text":"Jangan menjanjikan yang tak sanggup.","category":"singkat"},{"text":"Hargai orang yang menghargaimu.","category":"singkat"},{"text":"Lepaskan yang memang selesai.","category":"singkat"},{"text":"Jangan memaksa pintu tertutup.","category":"singkat"},{"text":"Ada jalan lain di depan.","category":"singkat"},{"text":"Tetap berjalan meski perlahan.","category":"singkat"},{"text":"Jangan ukur hidup dari saldo saja.","category":"singkat"},{"text":"Waktu sehat adalah kekayaan.","category":"singkat"},{"text":"Rumah nyaman dimulai dari hati.","category":"singkat"},{"text":"Keluarga bukan tempat melampiaskan emosi.","category":"singkat"},{"text":"Berbicara baik adalah investasi.","category":"singkat"},{"text":"Jangan lupa mengucap terima kasih.","category":"singkat"},{"text":"Maafkan diri atas kesalahan lama.","category":"singkat"},{"text":"Hari ini bukan kemarin.","category":"singkat"},{"text":"Besok belum tentu seperti dugaan.","category":"singkat"},{"text":"Nikmati apa yang sedang ada.","category":"singkat"},{"text":"Jangan menunggu semuanya sempurna.","category":"singkat"},{"text":"Satu keputusan bisa mengubah arah.","category":"singkat"},{"text":"Tetap belajar meski sudah bisa.","category":"singkat"},{"text":"Semoga langkahmu membawa manfaat.","category":"singkat"},{"text":"Hidup baik dimulai dari niat baik.","category":"singkat"},{"text":"Pilih menjadi bermanfaat.","category":"singkat"},{"text":"Jangan lupa berdoa.","category":"singkat"},{"text":"Berikan ruang bagi hal baik untuk tumbuh.","category":"singkat"},{"text":"Pagi hari ke pasar pagi membawa membeli pepaya yang indah pagi\nSinggah sebentar membeli bunga untuk hati\nKalau ingin hidup tenang di dalam pagi\nJaga ucapan, agar langkah tetap hati","category":"pantun"},{"text":"Menjelang sore berjalan menuju jalan desa, tampak membawa payung pagi\nAngin lembut datang membawa kabar hati\nBila hati ingin tumbuh dengan pagi\nRawat kepercayaan, jangan biarkan niat kehilangan hati","category":"pantun"},{"text":"Lewat taman kota, terlihat pedagang sedang menjemur padi pagi\nAnak kecil tersenyum sambil bermain di jalan hati\nJika ingin bahagia, jangan tinggalkan pagi\nHargai orang setia, supaya hidup terasa hati","category":"pantun"},{"text":"Senja turun di dekat stasiun lama, orang pulang membawa membawa kelapa pagi\nLangit kemerah-merahan membuat suasana hati\nJangan takut melangkah walau belum tahu akhir pagi\nJangan mudah menyerah, sebab usaha menuntun menuju hati","category":"pantun"},{"text":"Pagi hari ke tepi sungai membawa membeli ikan yang indah bunga\nSinggah sebentar membeli bunga untuk ceria\nKalau ingin hidup tenang di dalam bunga\nBelajar dari kecewa, agar langkah tetap ceria","category":"pantun"},{"text":"Menjelang sore berjalan menuju halaman rumah, tampak membawa layangan bunga\nAngin lembut datang membawa kabar ceria\nBila hati ingin tumbuh dengan bunga\nSyukuri rezeki, jangan biarkan niat kehilangan ceria","category":"pantun"},{"text":"Lewat ladang hijau, terlihat pedagang sedang menata dagangan bunga\nAnak kecil tersenyum sambil bermain di jalan ceria\nJika ingin bahagia, jangan tinggalkan bunga\nJangan simpan dendam, supaya hidup terasa ceria","category":"pantun"},{"text":"Senja turun di dekat bukit seberang, orang pulang membawa mencari rambutan bunga\nLangit kemerah-merahan membuat suasana ceria\nJangan takut melangkah walau belum tahu akhir bunga\nBerani memulai, sebab usaha menuntun menuju ceria","category":"pantun"},{"text":"Pagi hari ke kebun belakang membawa melihat perahu yang indah jalan\nSinggah sebentar membeli bunga untuk kawan\nKalau ingin hidup tenang di dalam jalan\nSabar menghadapi waktu, agar langkah tetap kawan","category":"pantun"},{"text":"Menjelang sore berjalan menuju dermaga kecil, tampak membawa sepeda jalan\nAngin lembut datang membawa kabar kawan\nBila hati ingin tumbuh dengan jalan\nJaga hati tetap tenang, jangan biarkan niat kehilangan kawan","category":"pantun"},{"text":"Lewat warung dekat sawah, terlihat pedagang sedang membawa keranjang jalan\nAnak kecil tersenyum sambil bermain di jalan kawan\nJika ingin bahagia, jangan tinggalkan jalan\nHormati orang tua, supaya hidup terasa kawan","category":"pantun"},{"text":"Senja turun di dekat pantai utara, orang pulang membawa menyiram tanaman jalan\nLangit kemerah-merahan membuat suasana kawan\nJangan takut melangkah walau belum tahu akhir jalan\nTekun mengejar cita, sebab usaha menuntun menuju kawan","category":"pantun"},{"text":"Pagi hari ke jalan desa membawa membeli mangga yang indah senja\nSinggah sebentar membeli bunga untuk bahagia\nKalau ingin hidup tenang di dalam senja\nBerbagi saat mampu, agar langkah tetap bahagia","category":"pantun"},{"text":"Menjelang sore berjalan menuju taman kota, tampak memetik melati senja\nAngin lembut datang membawa kabar bahagia\nBila hati ingin tumbuh dengan senja\nAkui salah dengan lapang, jangan biarkan niat kehilangan bahagia","category":"pantun"},{"text":"Lewat stasiun lama, terlihat pedagang seda tampak membawa layangan cempaka\nAngin lembut datang membawa kabar keluarga\nBila hati ingin tumbuh dengan cempaka\nJangan menilai dari tampilan, jangan biarkan niat kehilangan keluarga","category":"pantun"},{"text":"Lewat pantai utara, terlihat pedagang sedang menata dagangan cempaka\nAnak kecil tersenyum sambil bermain di jalan keluarga\nJika ingin bahagia, jangan tinggalkan cempaka\nBelajar mengendalikan emosi, supaya hidup terasa keluarga","category":"pantun"},{"text":"Senja turun di dekat teras rumah, orang pulang membawa mencari rambutan cempaka\nLangit kemerah-merahan membuat suasana keluarga\nJangan takut melangkah walau belum tahu akhir cempaka\nHormati perbedaan pendapat, sebab usaha menuntun menuju keluarga","category":"pantun"},{"text":"Pagi hari ke taman kota membawa melihat perahu yang indah kemuning\nSinggah sebentar membeli bunga untuk hati\nKalau ingin hidup tenang di dalam kemuning\nBerani berkata tidak, agar langkah tetap hati","category":"pantun"},{"text":"Menjelang sore berjalan menuju stasiun lama, tampak membawa sepeda kemuning\nAngin lembut datang membawa kabar hati\nBila hati ingin tumbuh dengan kemuning\nJaga kesehatan setiap hari, jangan biarkan niat kehilangan hati","category":"pantun"},{"text":"Lewat jembatan kayu, terlihat pedagang sedang membawa keranjang kemuning\nAnak kecil tersenyum sambil bermain di jalan hati\nJika ingin bahagia, jangan tinggalkan kemuning\nKerjakan sedikit demi sedikit, supaya hidup terasa hati","category":"pantun"},{"text":"Senja turun di dekat kebun jeruk, orang pulang membawa menyiram tanaman kemuning\nLangit kemerah-merahan membuat suasana hati\nJangan takut melangkah walau belum tahu akhir kemuning\nJangan mengejar pujian, sebab usaha menuntun menuju hati","category":"pantun"},{"text":"Pagi hari ke ladang hijau membawa membeli mangga yang indah seruni\nSinggah sebentar membeli bunga untuk berani\nKalau ingin hidup tenang di dalam seruni\nSyukuri hal sederhana, agar langkah tetap berani","category":"pantun"},{"text":"Menjelang sore berjalan menuju bukit seberang, tampak memetik melati seruni\nAngin lembut datang membawa kabar berani\nBila hati ingin tumbuh dengan seruni\nTetap berjalan meski lambat, jangan biarkan niat kehilangan berani","category":"pantun"},{"text":"Lewat kampung halaman, terlihat pedagang sedang membeli roti seruni\nAnak kecil tersenyum sambil bermain di jalan berani\nJika ingin bahagia, jangan tinggalkan seruni\nJangan membalas keburukan, supaya hidup terasa berani","category":"pantun"},{"text":"Senja turun di dekat danau tenang, orang pulang membawa mencari bunga seruni\nLangit kemerah-merahan membuat suasana berani\nJangan takut melangkah walau belum tahu akhir seruni\nPilih kata sebelum bicara, sebab usaha menuntun menuju berani","category":"pantun"},{"text":"Pagi hari ke warung dekat sawah membawa membeli pepaya yang indah pandan\nSinggah sebentar membeli bunga untuk kawan\nKalau ingin hidup tenang di dalam pandan\nHargai waktu orang lain, agar langkah tetap kawan","category":"pantun"},{"text":"Menjelang sore berjalan menuju pantai utara, tampak membawa payung pandan\nAngin lembut datang membawa kabar kawan\nBila hati ingin tumbuh dengan pandan\nJangan mudah percaya kabar, jangan biarkan niat kehilangan kawan","category":"pantun"},{"text":"Lewat teras rumah, terlihat pedagang sedang menjemur padi pandan\nAnak kecil tersenyum sambil bermain di jalan kawan\nJika ingin bahagia, jangan tinggalkan pandan\nJaga amanah yang diberikan, supaya hidup terasa kawan","category":"pantun"},{"text":"Senja turun di dekat lapangan desa, orang pulang membawa membawa kelapa pandan\nLangit kemerah-merahan membuat suasana kawan\nJangan takut melangkah walau belum tahu akhir pandan\nBerani meminta maaf, sebab usaha menuntun menuju kawan","category":"pantun"},{"text":"Pagi hari ke stasiun lama membawa membeli ikan yang indah sirih\nSinggah sebentar membeli bunga untuk bersih\nKalau ingin hidup tenang di dalam sirih\nBantu orang tanpa merendahkan, agar langkah tetap bersih","category":"pantun"},{"text":"Menjelang sore berjalan menuju jembatan kayu, tampak membawa layangan sirih\nAngin lembut datang membawa kabar bersih\nBila hati ingin tumbuh dengan sirih\nJangan lupakan keluarga, jangan biarkan niat kehilangan bersih","category":"pantun"},{"text":"Lewat kebun jeruk, terlihat pedagang sedang menata dagangan sirih\nAnak kecil tersenyum sambil bermain di jalan bersih\nJika ingin bahagia, jangan tinggalkan sirih\nJadikan gagal sebagai guru, supaya hidup terasa bersih","category":"pantun"},{"text":"Senja turun di dekat toko bunga, orang pulang membawa mencari rambutan sirih\nLangit kemerah-merahan membuat suasana bersih\nJangan takut melangkah walau belum tahu akhir sirih\nTetap baik meski tidak dipuji, sebab usaha menuntun menuju bersih","category":"pantun"}];
}
const DEFAULT_DATA=makeLargeData();

const LABEL={pantun:"Pantun",bijak:"Bijak",lucu:"Lucu",pagi:"Pagi",galau:"Galau",cinta:"Cinta",motivasi:"Motivasi",islami:"Islami",singkat:"Singkat"};
let custom=loadJSON("my_statuses",[]);let favorites=loadJSON("my_favs",[]);let currentFilter="all";let pendingDelete=null;
function loadJSON(k,f){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:f}catch(e){return f}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
function allItems(){return DEFAULT_DATA.concat(custom)}
function itemId(x){return x.id}
function makeId(){return "u_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function favoriteKey(x){return itemId(x)}
function normalizeCustom(){let changed=false;custom=custom.map(x=>{if(!x.id){changed=true;return {...x,id:makeId()}}return x});if(changed)saveJSON("my_statuses",custom)}
normalizeCustom();
function isFavorite(x){return favorites.includes(favoriteKey(x))}
function setFilter(cat){currentFilter=cat;document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("active",b.dataset.cat===cat));renderList()}
document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>setFilter(b.dataset.cat)));
document.getElementById("searchInput").addEventListener("input",renderList);
function renderList(){
 let q=document.getElementById("searchInput").value.trim().toLowerCase();let data=allItems();
 if(currentFilter==="fav")data=data.filter(isFavorite);else if(currentFilter!=="all")data=data.filter(x=>x.category===currentFilter);
 if(q)data=data.filter(x=>(x.text+" "+x.category).toLowerCase().includes(q));
 const list=document.getElementById("content-list");list.innerHTML="";
 document.getElementById("stats").textContent=data.length+" status ditemukan"+(q?" untuk pencarian Anda":"");
 if(!data.length){list.innerHTML='<div class="empty">😔<br><br>Tidak ada konten ditemukan.</div>';return}
 data.forEach(item=>{
  const card=document.createElement("div");card.className="card";
  const p=document.createElement("p");p.className="card-text";p.textContent=item.text;
  const foot=document.createElement("div");foot.className="footer";
  const badge=document.createElement("span");badge.className="badge";badge.textContent=(LABEL[item.category]||item.category).toUpperCase();
  const actions=document.createElement("div");actions.className="actions";
  const fav=document.createElement("button");fav.className="action";fav.textContent=isFavorite(item)?"❤️":"🤍";fav.title="Favorit";fav.onclick=()=>toggleFav(item);
  const copy=document.createElement("button");copy.className="action";copy.textContent="📋 Salin";copy.onclick=()=>copyText(item.text);
  const wa=document.createElement("button");wa.className="action wa";wa.textContent="📤 WA";wa.onclick=()=>shareWhatsApp(item.text);
  actions.append(fav,copy,wa);
  if(item.user){const del=document.createElement("button");del.className="action delete";del.textContent="🗑";del.title="Hapus";del.onclick=()=>askDelete(item.id);actions.append(del)}
  foot.append(badge,actions);card.append(p,foot);list.appendChild(card);
 });
}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else fallbackCopy(text);showToast("✓ Teks disalin!")}catch(e){fallbackCopy(text);showToast("✓ Teks disalin!")}}
function fallbackCopy(text){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.focus();t.select();document.execCommand("copy");t.remove()}
function shareWhatsApp(text){window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener")}
function toggleFav(item){const id=favoriteKey(item),i=favorites.indexOf(id);if(i>=0){favorites.splice(i,1);showToast("Dihapus dari Favorit")}else{favorites.push(id);showToast("❤️ Ditambahkan ke Favorit")}saveJSON("my_favs",favorites);renderList()}
function addCustomStatus(){const el=document.getElementById("customText"),text=el.value.trim(),cat=document.getElementById("customCategory").value;if(!text){showToast("⚠️ Tulis teks dulu!");el.focus();return}const item={id:makeId(),text,category:cat,user:true};custom.unshift(item);saveJSON("my_statuses",custom);el.value="";setFilter("all");showToast("✓ Status berhasil ditambah!")}
function askDelete(id){pendingDelete=id;document.getElementById("deleteModal").classList.add("show")}
function closeDelete(){pendingDelete=null;document.getElementById("deleteModal").classList.remove("show")}
function confirmDelete(){if(!pendingDelete)return;custom=custom.filter(x=>x.id!==pendingDelete);favorites=favorites.filter(x=>x!==pendingDelete);saveJSON("my_statuses",custom);saveJSON("my_favs",favorites);closeDelete();renderList();showToast("Status dihapus")}
function randomStatus(){const data=allItems();if(!data.length)return;const item=data[Math.floor(Math.random()*data.length)];document.getElementById("searchInput").value="";currentFilter="all";document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("active",b.dataset.cat==="all"));renderList();setTimeout(()=>{const cards=document.querySelectorAll(".card");const target=[...cards].find(c=>c.querySelector(".card-text")?.textContent===item.text);if(target){target.scrollIntoView({behavior:"smooth",block:"center"});target.animate([{transform:"scale(1)"},{transform:"scale(1.02)"},{transform:"scale(1)"}],{duration:350})}},30);showToast("🎲 Status acak dipilih")}
function toggleTheme(){const dark=document.body.getAttribute("data-theme")==="dark";document.body.setAttribute("data-theme",dark?"light":"dark");localStorage.setItem("my_theme",dark?"light":"dark");document.getElementById("themeBtn").textContent=dark?"🌙":"☀️"}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),1600)}
(function init(){const theme=localStorage.getItem("my_theme");if(theme==="dark"){document.body.setAttribute("data-theme","dark");document.getElementById("themeBtn").textContent="☀️"}renderList()})();
</script>
